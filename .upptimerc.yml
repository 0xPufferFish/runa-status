# Runa Rent uptime monitor — checks every 5 minutes from GitHub Actions. A failed check opens a GitHub
# issue assigned to the owner (GitHub notifies by email / mobile push) and closes it on recovery.
# Production only. Endpoint rationale: runa/docs/aslan-map.md (hosting) and runa/MIGRATION.md.
owner: 0xPufferFish
repo: runa-status

# WHAT THESE BODY CHECKS CANNOT SEE: the string each one asserts lives in index.html, which is
# served perfectly when the app is completely broken — it is the JavaScript that fails. Both
# blank-page reports on 2026-09-17 passed every check here. Real browsers now report that class
# themselves (POST /client-error, kind: boot_timeout -> panda's System page); nothing synthetic
# does, and Upptime cannot, because it does not run JavaScript. A check added here must assert on
# something only a BOOTED app produces, or it is measuring the web server, not the shop.

sites:
  # The catalog SPA shell. The body is checked because on 2026-09-11 the host rebooted and served
  # DomaiNesia's "your domain is ready" parking page with a 200.
  - name: Catalog (runarent.com)
    url: https://runarent.com/
    __dangerous__body_down_if_text_missing: Runa Rent
  # The API under the hostname both frontends call. /attire/attributes is what cat fetches at boot: it
  # runs a dozen DB queries, so a DB outage answers 500 here. It records no telemetry — the list and
  # detail routes record search / attire_view events, which a probe must never inflate.
  - name: API (www.api.runarent.com)
    url: https://www.api.runarent.com/v1/attire/attributes
    __dangerous__body_down_if_text_missing: '"msg":"OK"'
  # The same vhost under its canonical name, which DomaiNesia blocked on its own on 2026-09-14 while
  # www.api stayed up. Red here and green above means a hostname block at the host, not aslan.
  - name: API (api.runarent.com)
    url: https://api.runarent.com/v1/attire/attributes
    __dangerous__body_down_if_text_missing: '"msg":"OK"'
  # Photos are served by Apache straight off disk, not by Node — they kept serving through the 09-14
  # block. The logo is the one storage file no attire edit can delete (it is cat's og:image).
  - name: Photos (storage)
    url: https://api.runarent.com/storage/v1/logo.webp
  # admin. replaces panda. at cutover (MIGRATION.md 5b step 2) — the old Flutter admin it
  # serves today is dropped. Do NOT merge this before the cutover: admin. currently returns
  # that Flutter build, which happens to carry the same <title>, so this check would go
  # falsely green against the wrong application.
  - name: Panda (admin)
    url: https://admin.runarent.com/
    __dangerous__body_down_if_text_missing: Runa Panda

assignees:
  - 0xPufferFish

# Strict allowlist: no repository secret besides GH_PAT reaches the Upptime action. A notification
# channel added later (e.g. NOTIFICATION_TELEGRAM_*) must be listed here or it silently gets nothing.
secrets: []

# The history page's response-time chart (Chart.js) — Runa brand instead of Upptime's teal
graphBackgroundColor: "rgba(138, 75, 90, 0.15)"
graphBorderColor: "#8a4b5a"

status-website:
  baseUrl: /runa-status
  name: Runa Rent Status
  # Runa look (runarent.com): assets/runa.css, plus the logo and favicon copied into assets/ so the
  # status page never loads anything from the DomaiNesia box it is reporting on.
  theme: light
  links:
    - rel: stylesheet
      href: https://0xpufferfish.github.io/runa-status/runa.css
  logoUrl: https://0xpufferfish.github.io/runa-status/logo.webp
  hideNavTitle: true
  favicon: https://0xpufferfish.github.io/runa-status/favicon.ico
  introTitle: "Status layanan Runa Rent"
  introMessage: Diperiksa otomatis setiap 5 menit.
  navbar:
    - title: Status
      href: /
    - title: GitHub
      href: https://github.com/$OWNER/$REPO
